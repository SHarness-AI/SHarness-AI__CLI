[tool.poetry]
name        = "sharness-ai"
version     = "v0.1.0"
description = "SHarness: runs agents and their tools as small, single-purpose, kernel-locked processes talking over mutually authenticated connections. Experiments stage: probe, policy hash/check/translate, run, hello."
readme      = "README.md"
license     = "Apache-2.0"
authors     = ["The Cyber Boardroom"]
keywords    = ["sharness", "sharness-ai", "cli", "ai-agents", "agent-security", "sandbox",
               "landlock", "seccomp", "mtls", "kms", "least-privilege", "prompt-injection"]
homepage    = "https://sharness.ai"
repository  = "https://github.com/SHarness-AI/SHarness-AI__CLI"
documentation = "https://sharness.ai/design/architecture/index.html"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
packages = [{ include = "sharness_ai" }]

[tool.poetry.urls]
"Architecture"   = "https://sharness.ai/design/architecture/index.html"
"Roadmap"        = "https://sharness.ai/design/roadmap/index.html"
"Playground"     = "https://sharness.ai/code/playground/index.html"
"For AI agents"  = "https://sharness.ai/llms.txt"
"Issues" = "https://github.com/SHarness-AI/SHarness-AI__CLI/issues"

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.group.dev.dependencies]
pytest     = ">=8.0"
pytest-cov = ">=5.0"

[tool.poetry.scripts]
sharness-ai = "sharness_ai.cli:main"

[build-system]
requires      = ["poetry-core>=1.9.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths        = ["tests"]
addopts          = "-v --tb=short"
python_files     = "test_*.py"
python_classes   = "Test_*"
python_functions = "test_*"

[tool.coverage.run]
source = ["sharness_ai"]
omit   = ["tests/*"]
