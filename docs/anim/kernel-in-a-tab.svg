<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A real Linux kernel boots in a browser tab and enforces the policy</title>
  <desc id="d">Left, a browser window. Inside it, in sequence: a tab opens sharness.ai; v86 starts, an x86 PC in WebAssembly; Linux 6.18 boots and prints landlock: Up and running; sharness-ai hello runs and holds 6 of 6; the example policies run and the kernel refuses a write, a port and an allocation. Right, three counters: 28.5 seconds to hello in Chrome, nothing installed, 25 MB of static files. The loop repeats.</desc>
  <style>
    .s{opacity:0;animation:show 14s infinite}.s1{animation-delay:.3s}.s2{animation-delay:1.6s}.s3{animation-delay:3.2s}.s4{animation-delay:5s}.s5{animation-delay:7.2s}.s6{animation-delay:9.2s}
    .bar{animation:grow 14s infinite .3s;transform-origin:left}
    @keyframes show{0%{opacity:0}4%{opacity:1}93%{opacity:1}100%{opacity:0}}
    @keyframes grow{0%{transform:scaleX(0)}60%{transform:scaleX(1)}93%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    @media(prefers-reduced-motion:reduce){.s{animation:none;opacity:1}.bar{animation:none;transform:none}}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
  <rect width="960" height="360" fill="#faf9f5"/>
  <text x="24" y="32" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5c5f66">A KERNEL IN A TAB · NOTHING INSTALLED</text>
  <!-- browser window -->
  <rect x="24" y="48" width="620" height="292" rx="12" fill="#ffffff" stroke="#d5d0c2" stroke-width="2"/>
  <rect x="24" y="48" width="620" height="34" rx="12" fill="#f2f0e9"/><rect x="24" y="70" width="620" height="12" fill="#f2f0e9"/>
  <circle cx="44" cy="65" r="5" fill="#ff5f57"/><circle cx="60" cy="65" r="5" fill="#febc2e"/><circle cx="76" cy="65" r="5" fill="#28c840"/>
  <rect x="96" y="56" width="420" height="18" rx="9" fill="#ffffff" stroke="#e5e1d5"/>
  <text x="108" y="69" font-size="10.5" class="m" fill="#5c5f66">sharness.ai/code/browser/demo/</text>
  <rect x="36" y="94" width="596" height="234" rx="8" fill="#0d1117"/>
  <g class="m" font-size="11.5">
    <text x="50" y="118" class="s s1" fill="#8b949e">v86 0.5.472: an x86 PC in WebAssembly · 512 MiB · Alpine 3.23 x86</text>
    <text x="50" y="140" class="s s2" fill="#e6edf3">[    0.000000] Linux version 6.18.58-0-virt (Alpine)</text>
    <text x="50" y="158" class="s s2" fill="#e6edf3">[    0.306879] LSM: initializing lsm=lockdown,capability,landlock,yama</text>
    <text x="50" y="176" class="s s3" fill="#3fb950">[    0.307699] landlock: Up and running.</text>
    <text x="50" y="200" class="s s4" fill="#e6edf3">sharness-ai probe   uid 0 · Landlock ABI 7 · memfd_secret yes · cgroups v2</text>
    <text x="50" y="222" class="s s5" fill="#e6edf3">sharness-ai hello   <tspan fill="#3fb950" font-weight="700">result 6/6 held</tspan>  <tspan fill="#8b949e">at 28.5 s</tspan></text>
    <text x="50" y="246" class="s s6" fill="#e6edf3">P2  touch /work/x        <tspan fill="#f85149">Permission denied</tspan></text>
    <text x="50" y="264" class="s s6" fill="#e6edf3">P1  connect :80          <tspan fill="#f85149">EACCES</tspan>   <tspan fill="#8b949e">:443 allowed by the policy</tspan></text>
    <text x="50" y="282" class="s s6" fill="#e6edf3">P0  bytearray(200 MiB)   <tspan fill="#f85149">MemoryError</tspan>  <tspan fill="#8b949e">under a 64 MiB cap</tspan></text>
    <text x="50" y="310" class="s s6" fill="#8b949e">7 policies hash to the same values as on your laptop · SHARNESS-DONE</text>
  </g>
  <rect x="36" y="330" width="596" height="4" fill="#e5e1d5"/><rect x="36" y="330" width="596" height="4" fill="#0f766e" class="bar"/>
  <!-- right column -->
  <g font-size="12" fill="#34363c">
    <rect x="668" y="48" width="268" height="84" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="684" y="80" font-size="30" font-weight="700" fill="#115e59">28.5 s</text>
    <text x="684" y="100" fill="#34363c">to <tspan class="m">hello</tspan> holding 6 of 6, in Chrome</text>
    <text x="684" y="118" font-size="10.5" fill="#8a8d94">one emulated core; the harness itself takes 0.6 s</text>
    <rect x="668" y="146" width="268" height="84" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="684" y="178" font-size="30" font-weight="700" fill="#5b21b6">3 kernels</text>
    <text x="684" y="198">the tab, Node, and your own through chroot</text>
    <text x="684" y="216" font-size="10.5" fill="#8a8d94">the same files, the same result everywhere</text>
    <rect x="668" y="244" width="268" height="96" rx="12" fill="#ffffff" stroke="#d5d0c2" stroke-width="2"/>
    <text x="684" y="276" font-size="30" font-weight="700" fill="#101114">25 MB</text>
    <text x="684" y="296">of static files; no server, no account</text>
    <text x="684" y="314" font-size="10.5" fill="#8a8d94">a Boundary for the guest's child; a Setting for the page</text>
    <text x="684" y="330" font-size="10.5" fill="#8a8d94">it proves the kernel code paths, not your host</text>
  </g>
</svg>
