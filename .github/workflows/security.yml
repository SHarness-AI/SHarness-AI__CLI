name: security

# The security pass, on every push to dev, every pull request, and once a week (a weekly run
# catches a new advisory against an unchanged tree). Nothing here can publish anything: every
# job has read-only contents and no id-token. What each step guards is on sharness.ai/security.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: "Static checks: ruff (bandit rules), bandit, zizmor, secret shapes, pins"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the scanners at pinned versions
        run: pip install "ruff==0.17.2" "bandit==1.9.4" "zizmor==1.31.1" "pip-audit==2.10.1" "pytest>=8.0"
      - name: ruff, the security rule set from pyproject.toml
        run: ruff check sharness_ai experiments/browser tests
      - name: bandit, medium and above
        run: bandit -q -r sharness_ai -ll
      - name: zizmor on the workflows (pins, permissions, injection, credential persistence)
        run: zizmor --offline --min-severity low --min-confidence medium .github/workflows
      - name: The repository's own security tests (pinned actions, permissions, secret shapes, download pins)
        run: python -m pytest tests/unit/test_security.py -q

  supply-chain:
    name: "Dependencies: pip-audit, npm audit, SBOM"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The package has no runtime dependencies; audit what an install brings anyway
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q .
          /tmp/v/bin/pip freeze > /tmp/installed.txt          # what the package brings, not the venv's own pip
          cat /tmp/installed.txt
          pip install -q "pip-audit==2.10.1" "cyclonedx-bom==7.5.0"
          pip-audit --strict --desc on -r /tmp/installed.txt
      - name: SBOM (CycloneDX) of the installed package
        run: cyclonedx-py environment /tmp/v --of JSON -o sbom.cdx.json && python -c "import json; d=json.load(open('sbom.cdx.json')); print(len(d.get('components', [])), 'components')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The browser bench's one dependency (v86), audited
        working-directory: experiments/browser
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high

  dependency-review:
    name: "Dependency review on pull requests"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needs the repository's Dependency graph switched on (Settings, Code security), which only the
    # editor can do (sharness.ai/security/hardening, §3). Until then the job reports and does not fail
    # the workflow; remove continue-on-error once the graph is on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
