name: CI Pipeline - MAIN

# One workflow on purpose: PyPI's Trusted Publisher for `sharness-ai` is bound to this
# repository and to this exact filename (workflow.yml), so the publish job must live here
# (not in a reusable workflow it calls). Renaming this file breaks publishing until the
# PyPI publisher config is updated to match.
#
# Security review of 25 Oct 2026 (sharness.ai/security): the release path runs no third-party
# code except GitHub's own actions and pypa's publisher, every one pinned to a commit. The
# version bump is a few lines of shell in this file (it was a composite action from another
# repository, which in turn fetched an installer over the network and installed unpinned
# packages into the job that held the publishing token). Build and publish are separate jobs:
# the job that holds `id-token: write` only uploads what the build job produced.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the distributions and stop: no tag, no publish"
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false                  # never interrupt a half-done tag/publish

env:
  PACKAGE_NAME: 'sharness_ai'
  GIT__BRANCH : 'main'

jobs:
  run-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest pytest-cov
      - run: python -m pytest tests/unit --cov=sharness_ai --cov-report=term-missing

  increment-tag:
    name: "Increment Tag"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [run-tests]
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write                        # pushes the version-bump commit and the tag
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4  # zizmor: ignore[artipacked] - this job pushes the bump commit and the tag
        with:
          fetch-depth: 0
          ref: main
      - name: Bump the middle number, write it to the three files, commit, tag, push
        id: bump
        shell: bash
        env:
          GIT_BRANCH: ${{ env.GIT__BRANCH }}
          PACKAGE: ${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch --tags --quiet
          PREV=$(git tag --list 'v*' | sort -V | tail -1)
          if [ -z "$PREV" ]; then PREV=v0.0.0; git tag v0.0.0; git push origin v0.0.0; fi
          # a main release bumps the middle number: v0.N.0 -> v0.N+1.0 (the project's rule)
          NEW=$(echo "$PREV" | awk -F. '{sub(/^v/, "", $1); printf "v%d.%d.0", $1, $2 + 1}')
          echo "previous $PREV, next $NEW"
          sed -i -E "s/release-v[0-9]+\.[0-9]+\.[0-9]+/release-$NEW/" README.md
          printf '%s\n' "$NEW" > "./$PACKAGE/version"
          sed -i -E "s/^version(\s*)=(\s*)\"[^\"]*\"/version\1=\2\"$NEW\"/" pyproject.toml
          grep -q "\"$NEW\"" pyproject.toml && grep -qx "$NEW" "./$PACKAGE/version"
          git add README.md "./$PACKAGE/version" pyproject.toml
          git commit -m "Update release badge and version file"
          git tag "$NEW"
          git push origin "$GIT_BRANCH"
          git push origin "refs/tags/$NEW"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"

  build:
    name: "Build the distributions"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [run-tests, increment-tag]
    if: always() && needs.run-tests.result == 'success' && (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.increment-tag.outputs.tag || github.sha }}   # the bump commit when there was one
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel with a pinned builder
        run: |
          python -m pip install --upgrade "build==1.6.1"
          python -m build
          ls -l dist/
          python - <<'PY'
          import hashlib, pathlib
          for f in sorted(pathlib.Path("dist").iterdir()):
              print(hashlib.sha256(f.read_bytes()).hexdigest(), f.name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: "Publish to: PYPI"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, increment-tag]
    if: needs.build.result == 'success' && needs.increment-tag.result == 'success'
    permissions:
      contents: read
      id-token: write                        # PyPI Trusted Publishing (OIDC); this job runs no code of ours
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true                 # PEP 740 provenance alongside each file on PyPI
          print-hash: true
