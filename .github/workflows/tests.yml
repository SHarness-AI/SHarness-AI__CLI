name: tests

# The unit tests on every push to dev and every pull request, so dev is checked before it is
# released. The release pipeline (workflow.yml) runs them again on main before publishing.
# Landlock tests skip where the runner's kernel lacks it.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false               # one Python's failure should not hide the others'
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest tests/unit
      - name: The suite also passes without the package installed (as a fresh checkout runs it)
        run: |
          pip uninstall -y sharness-ai
          python -m pytest tests/unit -q
      - name: The browser bench's builders still import and the wheel builds (no network)
        run: python3 experiments/browser/build_wheel.py --out /tmp/wheel
