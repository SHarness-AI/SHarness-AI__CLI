name: tests
on:
  push: { branches: [dev] }
  pull_request: { branches: [dev, main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: The vendored vectors are present and parse (nothing is built here yet; REALITY.md says so)
        run: python3 -c "import json; m=json.load(open('conformance/vectors.json')); assert m['standard']=='policy'; print(len(m['cases']), 'vectors')"
